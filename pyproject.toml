[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "denote-lint"
version = "1.1.0"
description = "Static analysis for Emacs Denote note collections."
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
authors = [{ name = "Peter Smith", email = "mail@petersmith.org" }]
keywords = ["denote", "emacs", "lint", "notes", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
denote-lint = "denote_lint.cli:main"

[project.urls]
Homepage = "https://github.com/psmith1303/denote-lint"
Issues = "https://github.com/psmith1303/denote-lint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/denote_lint"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/denote_lint", "tests"]
